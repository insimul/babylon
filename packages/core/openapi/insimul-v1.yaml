openapi: 3.0.3
info:
  title: Insimul Platform API
  version: 1.0.0
  description: >-
    Conversation runtime surface consumed by the native engine SDKs (Unity,
    Unreal, Godot). Streaming endpoints return Server-Sent Events (text/event-stream);
    the SDK transport layer parses the SSE frames.
servers:
  - url: /
    description: Relative to the configured Insimul server base URL.
paths:
  /api/conversation/stream:
    post:
      operationId: streamConversation
      summary: Send player text and stream the character response as SSE.
      tags: [conversation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationTextRequest'
      responses:
        '200':
          description: Server-Sent Events stream of conversation chunks.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Malformed request.
  /api/conversation/stream-audio:
    post:
      operationId: streamConversationAudio
      summary: Send player audio and stream the character response as SSE.
      tags: [conversation]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationAudioRequest'
      responses:
        '200':
          description: Server-Sent Events stream of conversation chunks.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Malformed request.
  /api/conversation/end:
    post:
      operationId: endConversation
      summary: End a conversation session and release server resources.
      tags: [conversation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndSessionRequest'
      responses:
        '200':
          description: Session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSessionResponse'
  /api/conversation/health:
    get:
      operationId: healthCheck
      summary: Liveness probe for the conversation service.
      tags: [conversation]
      responses:
        '200':
          description: Service healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/worlds:
    get:
      operationId: listWorlds
      summary: List the worlds available to the editor.
      tags: [worlds]
      responses:
        '200':
          description: The world list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldListResponse'
  /api/worlds/detail:
    post:
      operationId: getWorldDetail
      summary: Fetch a single world's detail + stats.
      tags: [worlds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorldDetailRequest'
      responses:
        '200':
          description: The world detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorldDetailResponse'
  /api/generation/import:
    post:
      operationId: importWorld
      summary: Import/sync a world into the generation pipeline (dry-run supported).
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: The import/sync report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportReport'
  /api/generation/jobs:
    post:
      operationId: startGenerationJob
      summary: Start a generation job for a world.
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJobRequest'
      responses:
        '200':
          description: The started job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
  /api/generation/jobs/status:
    post:
      operationId: getGenerationJob
      summary: Poll a generation job's current status (polling fallback for SSE).
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRef'
      responses:
        '200':
          description: The job's current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationJob'
  /api/generation/jobs/events:
    post:
      operationId: streamGenerationJob
      summary: Stream a generation job's progress as SSE.
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRef'
      responses:
        '200':
          description: Server-Sent Events stream of job progress frames.
          content:
            text/event-stream:
              schema:
                type: string
  /api/generation/jobs/sync:
    post:
      operationId: syncGenerationJob
      summary: Apply a completed job's output and return the diff summary.
      tags: [generation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobRef'
      responses:
        '200':
          description: The applied diff summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncReport'
components:
  schemas:
    ConversationTextRequest:
      type: object
      required: [sessionId, characterId, worldId, text]
      properties:
        sessionId:
          type: string
        characterId:
          type: string
        worldId:
          type: string
        text:
          type: string
        languageCode:
          type: string
    ConversationAudioRequest:
      type: object
      required: [sessionId, characterId, worldId, audio]
      properties:
        sessionId:
          type: string
        characterId:
          type: string
        worldId:
          type: string
        languageCode:
          type: string
        audio:
          type: string
          format: binary
    EndSessionRequest:
      type: object
      required: [sessionId]
      properties:
        sessionId:
          type: string
    EndSessionResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
        version:
          type: string
    WorldListResponse:
      type: object
      required: [worlds]
      properties:
        worlds:
          type: array
    WorldDetailRequest:
      type: object
      required: [worldId]
      properties:
        worldId:
          type: string
    WorldDetailResponse:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        worldVersion:
          type: integer
        saveFormatVersion:
          type: integer
        engineRevision:
          type: string
        stats:
          type: object
        webUrl:
          type: string
    ImportRequest:
      type: object
      required: [worldId]
      properties:
        worldId:
          type: string
        dryRun:
          type: boolean
    ImportReport:
      type: object
      required: [worldId, dryRun]
      properties:
        worldId:
          type: string
        dryRun:
          type: boolean
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        unchanged:
          type: integer
        messages:
          type: array
    StartJobRequest:
      type: object
      required: [worldId, generator]
      properties:
        worldId:
          type: string
        generator:
          type: string
    JobRef:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
    GenerationJob:
      type: object
      required: [jobId, status]
      properties:
        jobId:
          type: string
        status:
          type: string
        stage:
          type: string
        progress:
          type: number
        message:
          type: string
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        error:
          type: string
    SyncReport:
      type: object
      required: [jobId, applied]
      properties:
        jobId:
          type: string
        applied:
          type: boolean
        added:
          type: integer
        updated:
          type: integer
        removed:
          type: integer
        messages:
          type: array
